[project]
name = "lease-agent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "aio-pika>=9.4",
    "lease-agent-db",
    "lease-agent-agents",
    "lease-agent-storage",
]

[tool.uv.sources]
lease-agent-db = { workspace = true }
lease-agent-agents = { workspace = true }
lease-agent-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
