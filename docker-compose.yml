services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lease_agent
      POSTGRES_PASSWORD: lease_agent
      POSTGRES_DB: lease_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lease_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672" # broker
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations and seeds units.json, then exits.
  migrate:
    build: ./backend
    working_dir: /app/packages/db
    command: sh -c "uv run alembic upgrade head && uv run python -m db.seed"
    environment:
      DATABASE_URL: postgresql+asyncpg://lease_agent:lease_agent@postgres:5432/lease_agent
      UNITS_JSON_PATH: /docs/units.json
    volumes:
      - ./backend:/app
      - ./docs:/docs
      - migrate_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    working_dir: /app/api
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://lease_agent:lease_agent@postgres:5432/lease_agent
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      STORAGE_DIR: /data/uploads
      RULESET_JSON_PATH: /docs/owner_ruleset.json
      UNITS_JSON_PATH: /docs/units.json
    volumes:
      - ./backend:/app
      - ./docs:/docs
      - api_venv:/app/.venv
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    working_dir: /app/worker
    command: uv run python -m worker.main
    environment:
      DATABASE_URL: postgresql+asyncpg://lease_agent:lease_agent@postgres:5432/lease_agent
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      STORAGE_DIR: /data/uploads
      RULESET_JSON_PATH: /docs/owner_ruleset.json
      UNITS_JSON_PATH: /docs/units.json
    volumes:
      - ./backend:/app
      - ./docs:/docs
      - worker_venv:/app/.venv
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  migrate_venv:
  api_venv:
  worker_venv:
  uploads:
  web_node_modules:
  web_next:
